name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Validate YAML files
        run: python -c "import glob,yaml; [yaml.safe_load(open(f)) for f in glob.glob('**/*.y*ml', recursive=True)]"
